version: '3.8'

services:
  app:
    build: .
    container_name: codeknights-app
    ports:
      - "80:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/codeknights?schema=public
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      # Mount the Docker socket so the app can spawn secure sandboxes
      - /var/run/docker.sock:/var/run/docker.sock

  db:
    image: postgres:15-alpine
    container_name: codeknights-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: codeknights
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
